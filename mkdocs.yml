site_name: cAliper User Guide
site_description: User guide for the cAliper translation management system
version: 1.0.0
docs_dir: docs
site_url: https://capstanlqc.github.io/caliper-guide
theme:
  icon:
    admonition:
      note: material/note-text
      abstract: material/text-box-outline
      info: material/cog
      tip: material/lightbulb
      success: material/check-circle
      question: material/help-circle
      warning: material/alert
      failure: material/close-circle
      danger: material/alert-octagon
      bug: material/bug
      example: material/code-braces
      quote: material/format-quote-close
  name: material
  logo: _assets/img/cApStAn_symbolesensemble_blanc.png
  favicon: _assets/favicon.ico
  palette:
    # Palette: default
    - media: "(prefers-color-scheme)"
      scheme: capstan
      primary: midnight-blue
      accent: indigo
      toggle:
        icon: material/eye-outline
        name: Switch to dark mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: capstan
      primary: midnight-blue
      accent: indigo
      toggle:
        icon: material/eye-outline
        name: Switch to dark-mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: midnight-blue
      accent: indigo
      toggle:
        icon: material/eye
        name: Switch to light-mode
  features:
    - navigation.path ## doesn't work!
    ## - toc.integrate
    - navigation.instant
    - navigation.tracking
    - navigation.prune
    - navigation.top
    - navigation.sections
    ## - navigation.tabs
    #- navigation.tabs.sticky
    ##- navigation.expand
    - toc.follow
    - navigation.indexes
    - content.footnote.tooltips
    - "hidden": "tech"  
markdown_extensions:
  - toc:
      # baselevel: 2
      permalink: True
      # separator: "-"
      toc_depth: 2-4
  # - md_in_html
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - tables
  # - footnotes
  # - pymdownx.snippets
  # - pymdownx.critic
  # - pymdownx.caret
  # - pymdownx.keys
  # - pymdownx.mark
  # - pymdownx.tilde
  # - pymdownx.betterem
  - pymdownx.emoji:
#      emoji_index: !!python/name:materialx.emoji.twemoji
#      emoji_generator: !!python/name:materialx.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # - pymdownx.highlight:
  #     anchor_linenums: true
  #     line_spans: __span
  #     pygments_lang_class: true
  # - pymdownx.inlinehilite
  # - pymdownx.snippets
  # - pymdownx.superfences
extra_css:
  - _assets/css/extra.css
copyright: Copyright &copy; 2026 cApStAn
extra:
  generator: false

plugins:
- search
- autorefs
# - exporter:
#     formats:
#       pdf:
#         enabled: true
#         aggregator:
#           enabled: true
#           output: pdf/caliper-manual.pdf
- print-site

nav:
  - Introduction: 00_introduction.md
  - Preparation: 01_preparation.md
  # - Preparing the translation environment:
  #     - Language assets: preparing/language-assets.md
  #     - Users: preparing/users.md
  #     - Workflow types: preparing/workflow-types.md
  - Jobs: 02_jobs.md
  - Workflows: 03_workflows.md
  - Transitions: 04_transitions.md
  # - Creating workflows: workflow-creation.md
  # - Monitoring workflows: workflow-monitoring.md
  # - Managing transitions: workflow-transitions.md
  - Projects: 05_projects.md
  - Support: 06_support.md